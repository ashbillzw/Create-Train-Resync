plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    // Process metadata templates for IDE resource output as well.
    copyIdeResources = true
}

repositories {
    flatDir {
        dir 'libs'
        if (System.getenv('NIIJIMA_MODS_DIR')) dir System.getenv('NIIJIMA_MODS_DIR')
    }

    maven { url = "https://maven.tterrag.com/" }               // Create deps (ok if unused)
    maven { url = "https://maven.ladysnake.org/releases" }     // MixinExtras
    maven { url = "https://repo.spongepowered.org/maven" }     // Sponge Mixin + plugin processor
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("local:create:${create_version}")
    implementation fg.deobf("local:pantographsandwires-forge:${pantographsandwires_version}")
    implementation fg.deobf("local:simpleplanes:${simpleplanes_version}")
    implementation fg.deobf("local:ctl-forge:${ctl_version}")
    implementation fg.deobf("local:touhoulittlemaid:${touhoulittlemaid_version}")
    compileOnly fg.deobf("local:mcef-forge:${mcef_version}")

    compileOnly fg.deobf("local:amendments:1.20-2.2.3")
    compileOnly fg.deobf("local:FarmersDelight:1.20.1-1.3.4")
    compileOnly fg.deobf("local:fruitsdelight:1.1.3")
    compileOnly fg.deobf("local:Jade:1.20.1-Forge-11.13.3")
    compileOnly fg.deobf("local:jei:1.20.1-forge-15.56.0.205")
    compileOnly fg.deobf("local:kaleidoscopecookery:1.6.0-forge+mc1.20.1")
    compileOnly fg.deobf("local:kaleidoscopetavern:1.2.0-forge+mc1.20.1")
    compileOnly fg.deobf("local:moonlight:1.20-2.16.15-forge")
    compileOnly fg.deobf("local:natures_spirit:2.2.5-1.20.1")
    compileOnly fg.deobf("local:supplementaries:1.20-3.1.18")

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, mixinextras_version_range)
    }
}

mixin {
    add sourceSets.main, "trainresync.refmap.json"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Specification-Vendor": mod_authors,
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": mod_authors,
            'MixinConfigs': 'trainresync.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        create_version_range: create_version_range,
        pantographsandwires_version_range: pantographsandwires_version_range,
        simpleplanes_version_range: simpleplanes_version_range,
        ctl_version_range: ctl_version_range,
        touhoulittlemaid_version_range: touhoulittlemaid_version_range
    ]
    // Keep the integration data inside the JAR, outside the always-active mod datapack.
    filesMatching(['data/shader_switch_debug/moonlight/soft_fluids/*_milkshake.json',
                   'data/oei/replacements/milk_integration_test.json', 'data/forge/tags/items/milk/milk_bottle.json',
                   'data/forge/tags/items/bottles/milk.json', 'data/trainresync/tags/items/cauldron_glow_ingredients.json',
                   'data/amendments/tags/moonlight/soft_fluids/can_glow.json']) {
        path = "niijima_cauldron/" + path
    }
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.register('cauldronAccountingTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ashbill.trainresync.compat.cauldron.MilkAmountsTest'
}
check.dependsOn cauldronAccountingTest
