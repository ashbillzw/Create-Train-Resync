# Gradle runtime
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft / Forge compile targets and mappings
minecraft_version=1.20.1
forge_version=47.2.0
mapping_channel=official
mapping_version=1.20.1

# Runtime compatibility ranges; these are not compile dependency versions.
minecraft_version_range=[1.20.1,)
forge_version_range=[47,)
loader_version_range=[47,)

# Mod metadata. mod_id must match the @Mod identifier in Java sources.
mod_id=trainresync
mod_name=Train Resync
mod_version=1.6.0.d
mod_group_id=com.ashbill
mod_license=MIT
mod_authors=ashbill
mod_description=Fix out-of-sync of Create trains.

# Local compile dependencies: versions must match JAR filenames in libs/.
create_version=1.20.1-0.5.1.j
pantographsandwires_version=1.20.1-beta-0.1.1
simpleplanes_version=1.20.1-5.3.3
ctl_version=1.0.0
touhoulittlemaid_version=1.4.0-forge+mc1.20.1

# Runtime mod versions (may differ from Maven artifact versions above)
create_version_range=[0.5.1.j,)
pantographsandwires_version_range=[0.1.1,)
simpleplanes_version_range=[1.20.1-5.3.3,)
ctl_version_range=[1.0.0,)
touhoulittlemaid_version_range=[1.4.0,)

# Mixin tooling and embedded MixinExtras
mixin_version=0.8.5
mixinextras_version=0.5.0
mixinextras_version_range=[0.5.0,)
